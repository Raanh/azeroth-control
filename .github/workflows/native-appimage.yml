name: Native AppImage

env:
  APP_VERSION: 0.4.0-preview.23

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libx11-dev python3 qt6-base-dev qt6-declarative-dev xvfb xauth qml6-module-qtqml qml6-module-qtqml-models qml6-module-qtqml-workerscript qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-shapes qml6-module-qtquick-templates qml6-module-qtquick-window
      - name: Validate provider contract
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m py_compile backend/server.py
          bash -n scripts/install-server.sh scripts/server-control-managed scripts/repair-server-managed scripts/update-server-managed scripts/coa-mysql-managed
      - name: Build native application
        run: |
          mkdir -p build/native
          cd build/native
          qmake6 ../../native/AzerothControl.pro
          make -j"$(nproc)"
      - name: Assemble AppDir
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/azeroth-control AppDir/usr/share/icons/hicolor/scalable/apps
          install -m755 build/native/azeroth-control-native AppDir/usr/bin/azeroth-control-native
          cp -a backend manifests resources scripts AppDir/usr/share/azeroth-control/
          install -m644 public/favicon.svg AppDir/usr/share/icons/hicolor/scalable/apps/org.azerothcontrol.app.svg
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          mkdir -p release
          APPIMAGE_PATH="$PWD/release/Azeroth-Control-${APP_VERSION}-x86_64.AppImage"
          set -o pipefail
          QMAKE=/usr/bin/qmake6 QML_SOURCES_PATHS="$PWD/native/qml" APPIMAGE_EXTRACT_AND_RUN=1 \
            LDAI_OUTPUT="$APPIMAGE_PATH" \
            ./linuxdeploy-x86_64.AppImage --appdir AppDir \
              --executable AppDir/usr/bin/azeroth-control-native \
              --desktop-file packaging/org.azerothcontrol.app.desktop \
              --icon-file public/favicon.svg --plugin qt --output appimage 2>&1 | tee linuxdeploy.log
          MISSING_QML="$(grep "ERROR: Missing qml module" linuxdeploy.log \
            | grep -Ev 'QtQuick\.Controls\.(Windows|macOS|iOS)( |$)' || true)"
          if [[ -n "$MISSING_QML" ]]; then
            printf '%s\n' "$MISSING_QML" >&2
            echo "linuxdeploy reported a missing QML runtime module" >&2
            exit 1
          fi
          test -f AppDir/usr/qml/QtQml/WorkerScript/qmldir
          test -f AppDir/usr/qml/QtQml/WorkerScript/libworkerscriptplugin.so
          chmod +x "$APPIMAGE_PATH"
      - name: Smoke-test packaged application
        run: |
          APPIMAGE_PATH="$PWD/release/Azeroth-Control-${APP_VERSION}-x86_64.AppImage"
          set +e
          timeout --signal=TERM --kill-after=2s 10s xvfb-run -a env \
            APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=xcb QSG_RHI_BACKEND=software \
            "$APPIMAGE_PATH" >appimage-smoke.log 2>&1
          STATUS=$?
          set -e
          cat appimage-smoke.log
          if [[ "$STATUS" -ne 124 ]]; then
            echo "Packaged application exited during startup (status $STATUS)" >&2
            exit 1
          fi
          if grep -Eq 'failed to load component|module ".+" is not installed|QML failed to load' appimage-smoke.log; then
            echo "Packaged application reported a QML startup failure" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: Azeroth-Control-${{ env.APP_VERSION }}-x86_64
          path: |
            release/Azeroth-Control-${{ env.APP_VERSION }}-x86_64.AppImage
            scripts/Azeroth-Control-SteamOS.sh
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "release/Azeroth-Control-${APP_VERSION}-x86_64.AppImage" \
            scripts/Azeroth-Control-SteamOS.sh \
            --title "Azeroth Control 0.4.0 Preview 21" --generate-notes --prerelease
