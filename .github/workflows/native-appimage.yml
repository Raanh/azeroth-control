name: Native AppImage

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libx11-dev python3 qt6-base-dev qt6-declarative-dev qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-templates
      - name: Validate provider contract
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m py_compile backend/server.py
          bash -n scripts/install-server.sh scripts/server-control-managed scripts/repair-server-managed scripts/update-server-managed scripts/coa-mysql-managed
      - name: Build native application
        run: |
          mkdir -p build/native
          cd build/native
          qmake6 ../../native/AzerothControl.pro
          make -j"$(nproc)"
      - name: Assemble AppDir
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/azeroth-control AppDir/usr/share/icons/hicolor/scalable/apps
          install -m755 build/native/azeroth-control-native AppDir/usr/bin/azeroth-control-native
          cp -a backend manifests resources scripts AppDir/usr/share/azeroth-control/
          install -m644 public/favicon.svg AppDir/usr/share/icons/hicolor/scalable/apps/org.azerothcontrol.app.svg
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          mkdir -p release
          QMAKE=/usr/bin/qmake6 QML_SOURCES_PATHS="$PWD/native/qml" APPIMAGE_EXTRACT_AND_RUN=1 \
            OUTPUT="$PWD/release/Azeroth-Control-0.4.0-preview.12-x86_64.AppImage" \
            ./linuxdeploy-x86_64.AppImage --appdir AppDir \
              --executable AppDir/usr/bin/azeroth-control-native \
              --desktop-file packaging/org.azerothcontrol.app.desktop \
              --icon-file public/favicon.svg --plugin qt --output appimage
          chmod +x release/Azeroth-Control-0.4.0-preview.12-x86_64.AppImage
      - uses: actions/upload-artifact@v7
        with:
          name: Azeroth-Control-0.4.0-preview.12-x86_64
          path: |
            release/Azeroth-Control-0.4.0-preview.12-x86_64.AppImage
            scripts/Azeroth-Control-SteamOS.sh
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/Azeroth-Control-0.4.0-preview.12-x86_64.AppImage \
            scripts/Azeroth-Control-SteamOS.sh \
            --title "Azeroth Control 0.4.0 Preview 12" --generate-notes --prerelease
